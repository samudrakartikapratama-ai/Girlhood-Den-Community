<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body{margin:0;background:#eee;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif}
@keyframes spin1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div style="max-width: 380px; margin: 0 auto; position: relative; overflow: hidden; border-radius: 20px; background: radial-gradient(ellipse at center, #FF53E3 0%, #FF6FE0 12%, #E87DEE 26%, #D181F5 40%, #C283FC 58%, #BC84FD 75%, #BE84FD 100%); padding: 28px 18px 24px;">

  <div style="position: relative; z-index: 2; text-align: center; margin-bottom: 14px;">
    <div style="position: relative; width: 150px; height: 150px; margin: 0 auto; border-radius: 50%; background: #fff; box-shadow: 0 6px 20px rgba(74,43,71,0.3); overflow: hidden;">
      <img src="https://ovfwbjeotrhkzjaxpuwq.supabase.co/storage/v1/object/public/brand-assets/submark-ring.png" style="position: absolute; inset: 0; width: 100%; height: 100%; animation: spin1 14s linear infinite;">
      <div style="position: absolute; top: 18%; left: 18%; width: 64%; height: 64%; border-radius: 50%; overflow: hidden;">
        <img src="https://ovfwbjeotrhkzjaxpuwq.supabase.co/storage/v1/object/public/brand-assets/submark-g.png" style="width: 100%; height: 100%;">
      </div>
    </div>
  </div>

  <div style="position: relative; z-index: 2; display: flex; flex-direction: column; gap: 10px;">
    <button style="display: flex; align-items: center; gap: 12px; background: #fff; border: none; border-radius: 16px; padding: 14px 16px; text-align: left; box-shadow: 0 4px 0 rgba(74,43,71,0.25);">
      <div style="width: 38px; height: 38px; border-radius: 50%; background: #FFE566; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 17px;">🛠️</div>
      <span style="font-size: 14px; font-weight: 700; color: #4A2B47;">Masuk sebagai Internal</span>
    </button>
    <button style="display: flex; align-items: center; gap: 12px; background: #fff; border: none; border-radius: 16px; padding: 14px 16px; text-align: left; box-shadow: 0 4px 0 rgba(74,43,71,0.25);">
      <div style="width: 38px; height: 38px; border-radius: 50%; background: #E1F5EE; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 17px;">👤</div>
      <span style="font-size: 14px; font-weight: 700; color: #4A2B47;">Masuk sebagai Creator</span>
    </button>
    <button style="display: flex; align-items: center; gap: 12px; background: #fff; border: none; border-radius: 16px; padding: 14px 16px; text-align: left; box-shadow: 0 4px 0 rgba(74,43,71,0.25);">
      <div style="width: 38px; height: 38px; border-radius: 50%; background: #FBEAF0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 17px;">🏢</div>
      <span style="font-size: 14px; font-weight: 700; color: #4A2B47;">Masuk sebagai Brand</span>
    </button>
  </div>

  <p style="position: relative; z-index: 2; text-align: center; font-size: 11px; color: #fff; margin: 16px 0 0; opacity: 0.9;">Belum punya akun? <b style="text-decoration: underline;">Daftar di sini</b></p>
</div>

</body>
</html>
